name: Update Google Play games

# Keeps the mobile section of the site and the pitch deck in sync with the
# public Google Play developer page. Runs every 6 hours, or on demand from the
# Actions tab ("Run workflow"). Only commits when something actually changed.

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: update-play-games
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix scripts

      - name: Fetch games from Google Play
        run: node scripts/update-play-games.mjs

      - name: Commit and push changes
        id: commit
        run: |
          git add data/play-games.json assets/play
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Google Play games data"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN do not always start a Pages build, so ask for one.
      - name: Request a Pages build
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds"
